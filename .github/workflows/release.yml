name: Release optional 16 kHz JMBE

on:
  push:
    tags:
      - 'v*-16khz.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Require this branch's exact optional release
        run: test "$GITHUB_REF_NAME" = "v1.0.17-16khz.1"

      - name: Test library and Creator
        run: ./gradlew codec:test creator:test codec:jar --no-daemon --stacktrace

      - name: Build platform creators
        run: ./gradlew creator:runtimeZip --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            creator/build/image/jmbe-creator-*.zip \
            codec/build/libs/jmbe-*-16khz.*.jar \
            --title "JMBE $GITHUB_REF_NAME (optional 16 kHz)" \
            --prerelease --latest=false \
            --notes-file RELEASE_NOTES.md
