name: Release JMBE Creator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to publish
        required: true
        type: string
        default: 'v1.0.18'
      source_commit:
        description: Exact commit required for the existing tag
        required: true
        type: string
        default: 'c4df2d147f5067a854160baaf4eeb04ffd66fba1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}

    steps:
      - name: Verify release inputs
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'Expected a full 40-character hexadecimal commit SHA.'
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Manual recovery requires an existing stable vX.Y.Z tag.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify immutable release source
        run: |
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_COMMIT,,}" ]]; then
            echo 'Release tag does not match the expected source commit.'
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache verified vendor JDK archives
        run: |
          set -o pipefail
          while read -r target platform expected_size checksum; do
            filename="bellsoft-jdk25.0.1+11-${platform}-full.tar.gz"
            cdn_url="https://download.bell-sw.com/java/25.0.1+11/$filename"
            if ! grep -Fq "jdkHome = jdkDownload(\"$cdn_url\")" creator/build.gradle; then
              continue
            fi
            archive="creator/build/jdks/${target}-${RELEASE_TAG}/jdk.tar.gz"
            mkdir -p "$(dirname "$archive")"
            curl --fail --location --connect-timeout 30 --max-time 300 --retry 3 --retry-all-errors \
              --output "$archive.part" "https://github.com/bell-sw/Liberica/releases/download/25.0.1%2B11/${filename//+/%2B}"
            [[ "$(stat -c %s "$archive.part")" -eq "$expected_size" ]]
            echo "$checksum  $archive.part" | sha256sum --check --strict
            mv "$archive.part" "$archive"
          done <<'JDKS'
          linux-aarch64 linux-aarch64 398326546 c6a075e81b84af9745fd141f0e70cfaa7b62b023e3547a913a65315c5b40f9e5
          linux-x86_64 linux-amd64 404719731 03ff3e3e1dfae0e2af43935f3854257d8f3dc44d3fe582a576fa9ce2361f11c2
          osx-aarch64 macos-aarch64 348726738 0721638c99772920bef0d5bd517bad68b652fa0a50c22572a84e8e0951f564e9
          osx-x86_64 macos-amd64 358806620 8d582451222420e1adb5533fbb61cf431baf2aea4ccda31e9d7098cf7bd1b0f2
          JDKS

      - name: Build platform creators
        env:
          JAVA_TOOL_OPTIONS: -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=120000
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/jmbe-creator-build.log"
          for attempt in 1 2 3; do
            if ./gradlew test creator:runtimeZip --no-daemon --stacktrace --info 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]] ||
              ! grep -Fq "Execution failed for task ':creator:jre'." "$build_log" ||
              ! grep -Eq 'java\.io\.IOException: (Premature EOF|Server returned HTTP response code: (408|429|5[0-9]{2}))|java\.net\.(SocketTimeoutException|ConnectException):|java\.net\.SocketException: Connection reset' "$build_log"; then
              exit 1
            fi
            for cache in creator/build/jdks/{linux-aarch64,linux-x86_64,osx-aarch64,osx-x86_64}-"$RELEASE_TAG"; do
              if [[ -f "$cache/jdk.tar.gz" ]] && ! gzip -t "$cache/jdk.tar.gz" 2>/dev/null; then
                rm -rf -- "$cache"
              fi
            done
            echo "Retrying JDK download after transport failure (attempt $((attempt + 1)) of 3)."
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$RELEASE_TAG" \
            creator/build/image/jmbe-creator-*.zip \
            --title "JMBE $RELEASE_TAG" \
            --verify-tag \
            "${notes_args[@]}"
