plugins {
    id 'java'
    id 'application'
    id 'org.beryx.runtime' version '2.0.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-io:commons-io:2.7'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'org.slf4j:slf4j-simple:1.7.25'
    implementation 'pl.edu.icm:JLargeArrays:1.6'
}

application {
    mainClass = "io.github.dsheirer.jmbe.creator.Creator"
}

jar {
    manifest {
        attributes 'Implementation-Title': "${base.archivesName.get()}",
                   'Implementation-Version': archiveVersion
    }
    from rootProject.file('LICENSE')
}

/**
 * Beryx Runtime plugin - download OS specific JDK and creates a compact OS-specific creator image.
 */
runtime {
    targetPlatform("linux-aarch64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-linux-aarch64-full.tar.gz")
    }

    targetPlatform("linux-x86_64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-linux-amd64-full.tar.gz")
    }

    targetPlatform("osx-x86_64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-macos-amd64-full.tar.gz")
    }

    targetPlatform("osx-aarch64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-macos-aarch64-full.tar.gz")
    }

    targetPlatform("windows-aarch64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-windows-aarch64-full.zip")
    }

    targetPlatform("windows-x86_64-v" + version) {
        jdkHome = jdkDownload("https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-windows-amd64-full.zip")
    }

    modules = ['jdk.crypto.ec','java.desktop','jdk.compiler','java.base','jdk.zipfs']
    additive = true
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    imageZip = file("$buildDir/image/jmbe-creator.zip")
}
