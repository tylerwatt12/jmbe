plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'org.slf4j:slf4j-simple:1.7.25'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'pl.edu.icm:JLargeArrays:1.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    implementation project(':api')
    testImplementation 'junit:junit:4.13.2'
}

base {
    archivesName = 'jmbe'
}

jar {
    manifest {
        attributes('Implementation-Title': rootProject.name,
                'Version': '1.0.17',
                'Implementation-Version': project.version,
                'Audio-Output-Flavor': '16khz',
                'Site': 'https://github.com/tylerwatt12/jmbe')
    }
    from rootProject.file('LICENSE')
    from rootProject.file('MODEL_NOTICES.md')

    doLast {
        if(archiveFile.get().asFile.exists())
        {
            println("Your finished JMBE library is located here: " + archiveFile.get().toString())
        }
        else
        {
            println("Failed to create the JMBE library.")
        }
    }
}
